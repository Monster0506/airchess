name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AIRCHESS_SERVER_URL: ${{ secrets.AIRCHESS_SERVER_URL }}
      AIRCHESS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AIRCHESS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AIRCHESS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in AIRCHESS_SERVER_URL ANDROID_KEYSTORE_BASE64 AIRCHESS_KEYSTORE_PASSWORD AIRCHESS_KEY_ALIAS AIRCHESS_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing release setting: $name"
              exit 1
            fi
          done
          umask 077
          AIRCHESS_KEYSTORE_FILE="$RUNNER_TEMP/airchess.jks"
          echo "AIRCHESS_KEYSTORE_FILE=$AIRCHESS_KEYSTORE_FILE" >> "$GITHUB_ENV"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AIRCHESS_KEYSTORE_FILE"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        run: |
          sh ./gradlew :chess:test :protocol:test :server:test :app:testDebugUnitTest :app:assembleRelease \
            --console=plain --no-configuration-cache \
            "-Pairchess.serverUrl=$AIRCHESS_SERVER_URL" \
            "-Pairchess.versionCode=$VERSION_CODE" \
            "-Pairchess.versionName=$VERSION_NAME"
      - name: Package download
        run: |
          mkdir -p "$RUNNER_TEMP/download"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/download/airchess.apk"
          cd "$RUNNER_TEMP/download"
          sha256sum airchess.apk > SHA256SUMS
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-$VERSION_NAME-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$RUNNER_TEMP/download/airchess.apk" "$RUNNER_TEMP/download/SHA256SUMS" \
            --target "$GITHUB_SHA" --latest --title "Android $VERSION_NAME" \
            --notes "Signed Android APK built from $GITHUB_SHA. Requires Android 8.0 or later. Stockfish hints require arm64. Source and third-party licenses are in the repository's README and ATTRIBUTIONS.md."
          echo "[Download Android app](https://github.com/$GITHUB_REPOSITORY/releases/latest/download/airchess.apk)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f "$AIRCHESS_KEYSTORE_FILE"
