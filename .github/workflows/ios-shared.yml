name: iOS shared

on:
  push:
    branches:
      - feat/ios-core
      - feat/ios-engine
      - feat/ios
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      AIRCHESS_SF_CACHE: ${{ github.workspace }}/.cache/stockfish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Cache Stockfish source and net
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AIRCHESS_SF_CACHE }}
          key: stockfish-inputs-${{ hashFiles('ios/stockfish/pins.env') }}

      # Same key as ios-stockfish.yml, so a cache hit skips the C++ build.
      - name: Cache Stockfish xcframework
        id: xcframework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/stockfish/build/Stockfish.xcframework
          key: stockfish-xcframework-${{ hashFiles('ios/stockfish/build.sh', 'ios/stockfish/pins.env', 'ios/stockfish/lib.mk', 'ios/stockfish/patches/**', 'ios/stockfish/src/**', 'ios/stockfish/include/**') }}

      - name: Build Stockfish xcframework
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: ios/stockfish/build.sh ios

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/feat/ios' }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Test on the iOS simulator and link the debug framework
        run: |
          ./gradlew --console=plain \
            :chess:iosSimulatorArm64Test \
            :protocol:iosSimulatorArm64Test \
            :shared:iosSimulatorArm64Test \
            :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Show engine test results
        if: always()
        run: |
          for f in shared/build/test-results/iosSimulatorArm64Test/*Stockfish*.xml; do
            grep -E '<testsuite |<testcase |<failure' "$f"
          done

      - name: Link the release framework for devices
        run: ./gradlew --console=plain :shared:linkReleaseFrameworkIosArm64

      - name: Check the engine is linked into the frameworks
        run: |
          for f in shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework/Shared \
                   shared/build/bin/iosArm64/releaseFramework/Shared.framework/Shared; do
            xcrun nm -g "$f" | grep -E ' T _sf_(start|send|read_line|stop)$'
          done
