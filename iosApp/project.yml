name: AirChess

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  SceneView:
    url: https://github.com/sceneview/sceneview
    exactVersion: 4.62.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AirChess:
    type: application
    platform: iOS
    sources:
      - path: AirChess
        excludes:
          - Info.plist
      - path: Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: SceneView
        product: SceneViewSwift
    preBuildScripts:
      - name: Build the Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        INFOPLIST_FILE: AirChess/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared

  AirChessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirChessUITests
    dependencies:
      - target: AirChess
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRCHESS_BUNDLE_ID).uitests
        TEST_TARGET_NAME: AirChess

schemes:
  AirChess:
    build:
      targets:
        AirChess: all
        AirChessUITests: [test]
    test:
      targets:
        - AirChessUITests
