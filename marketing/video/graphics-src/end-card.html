<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AirChess end card</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  .board { position: absolute; width: 1080px; height: 1080px; display: block; }
  .fade { position: absolute; inset: 0; }
  .copy { position: absolute; }
  .icon { display: block; width: 220px; height: 220px; margin-bottom: 36px; }
  h1 { margin: 0; font-family: var(--font-semi); font-weight: 600; font-size: 150px; line-height: 1; letter-spacing: -2px; color: var(--ink); }
  .tag { margin: 22px 0 0; font-size: 60px; color: var(--ink); }
  .meta { margin: 26px 0 0; font-size: 34px; color: var(--muted); }
  .link { margin: 18px 0 0; font-size: 36px; color: var(--accent); text-decoration: underline; text-underline-offset: 6px; }

  @media (orientation: landscape) {
    .board { right: -40px; top: 0; }
    .fade { background: linear-gradient(90deg, var(--bg) 0%, rgba(22, 35, 30, 0.92) 30%, rgba(22, 35, 30, 0) 62%); }
    .copy { left: 160px; top: 50%; transform: translateY(-50%); }
  }
  @media (orientation: portrait) {
    .board { left: 0; top: 0; }
    .fade { background: linear-gradient(180deg, rgba(22, 35, 30, 0) 45%, var(--bg) 100%); }
    .copy { left: 0; right: 0; top: 1090px; text-align: center; }
    .icon { margin: 0 auto 36px; }
    h1 { font-size: 130px; }
    .tag { font-size: 56px; }
  }
</style>
</head>
<body>
<img class="board" src="../assets/graphics/board-3d-render.png" alt="">
<div class="fade"></div>
<main class="copy">
  <img class="icon" src="app-icon.svg" alt="AirChess app icon">
  <h1>AirChess</h1>
  <p class="tag">Chess, wherever you are.</p>
  <p class="meta">Free for Android · No account · No ads</p>
  <p class="link">github.com/Monster0506/airchess/releases</p>
</main>
</body>
</html>
