<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AirChess invite bubble</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Designed at 1080 px wide. ?w=720 scales the whole block with CSS zoom. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #fit { width: 1080px; box-sizing: border-box; padding: 40px; display: flex; align-items: flex-start; gap: 20px; font-family: var(--font); }
  .avatar {
    flex: none; width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); color: var(--bg);
    font-family: var(--font-semi); font-weight: 600; font-size: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .col { display: flex; flex-direction: column; align-items: flex-start; }
  .name {
    margin: 0 0 10px 0; padding: 4px 16px;
    border-radius: 999px; background: rgba(16, 23, 19, 0.82);
    font-family: var(--font-semi); font-weight: 600; font-size: 28px; line-height: 1.3;
    color: var(--ink);
  }
  .bubble {
    max-width: 720px; box-sizing: border-box; padding: 22px 30px 24px;
    background: var(--ink); color: var(--bg);
    font-size: 44px; line-height: 1.3;
    border-radius: 34px 34px 34px 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
  }
  .bubble b { font-family: var(--font-semi); font-weight: 600; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="fit">
  <div class="avatar">A</div>
  <div class="col">
    <p class="name">Alex</p>
    <div class="bubble">Play me in AirChess! Code: <b>K7Q2MD</b></div>
  </div>
</div>
<script>
  const w = Number(new URLSearchParams(location.search).get('w') || 1080);
  document.getElementById('fit').style.zoom = (w / 1080).toFixed(4);
</script>
</body>
</html>
